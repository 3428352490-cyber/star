name: Bump Version

# 触发条件：向 main 分支推送代码时执行
# 版本递增规则（重要）：
#   - 仅当本次提交包含业务代码/功能改动时，自动递增补丁版本号（+0.0.1）；
#   - 若本次提交仅修改版本/公告相关文件（version.json / notice.json / js/config.js / sw.js），
#     属于「当前版本内修正」（如更新公告文字），不递增版本号，直接随当前 vX.X.X 部署；
#   - 公告 notice.json 必须与版本号一起打包：公告 version 字段需与 version.json 完全一致，
#     每次构建前强制校验，不一致则阻断构建。
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 需要上一个提交以对比改动文件（防死循环）

      # ---------------------------------------------------------------
      # 版本一致性校验（每次构建前强制）：
      # version.json.version、notice.json.version、js/config.js 的 app.version
      # 三者必须完全一致；不一致 → 阻断本次构建并提示版本不匹配。
      # 这保证公告与版本号一起打包、同一次 commit 部署，杜绝公告版本漂移。
      # ---------------------------------------------------------------
      - name: Validate version consistency
        run: |
          node - <<'EOF'
          const fs = require('fs');
          function readVersion(p) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            return String(j.version || j.latestVersion || '').trim();
          }
          const verJson = readVersion('version.json');
          const noticeJson = readVersion('notice.json');
          const cfg = fs.readFileSync('js/config.js', 'utf8');
          const m = cfg.match(/version:\s*'(\d+\.\d+\.\d+)'/);
          const cfgVer = m ? m[1] : '';
          if (!verJson || !noticeJson || !cfgVer) {
            console.error('版本校验失败：version.json / notice.json / config.js 缺少版本号');
            process.exit(1);
          }
          if (verJson !== noticeJson || verJson !== cfgVer) {
            console.error('版本不匹配：version.json=' + verJson + '，notice.json=' + noticeJson + '，config.js=' + cfgVer);
            console.error('公告 notice.json 必须与当前版本号一起打包并保持一致；请修正后重新推送。');
            process.exit(1);
          }
          console.log('版本一致性校验通过：version.json / notice.json / config.js = ' + verJson);
          EOF

      # ---------------------------------------------------------------
      # 防死循环 + 递增判定：
      # 对比本次 push 的 before/after 全部提交改动（避免多提交推送时只检查最后
      # 一个 commit 而漏检业务改动）；改动仅含版本/公告相关文件
      # （version.json / notice.json / js/config.js / sw.js）→ 判定为「当前版本内
      # 修正 / 版本提交」，不递增版本号、不自动提交；包含任何业务代码/功能改动 → 触发补丁递增。
      # ---------------------------------------------------------------
      - name: Detect version-only changes
        id: detect
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="(initial-push)"
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          fi
          ONLY_VERSION_FILES=true
          for f in $CHANGED; do
            case "$f" in
              version.json|notice.json|js/config.js|sw.js) ;;
              *) ONLY_VERSION_FILES=false ;;
            esac
          done
          echo "only_version_files=$ONLY_VERSION_FILES" >> "$GITHUB_OUTPUT"
          echo "changed_files=$CHANGED"

      # ---------------------------------------------------------------
      # 版本递增（仅业务代码/功能改动触发）：
      # version.json 补丁号 +1（1.0.4 → 1.0.5），并同步四处：
      #   js/config.js 的 app.version、sw.js 的 CACHE_NAME、notice.json 的 version 字段
      # （公告文字 items 由开发者人工维护，本次只同步版本号保持三者一致）
      # ---------------------------------------------------------------
      - name: Bump patch version
        if: steps.detect.outputs.only_version_files == 'false'
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const p = 'version.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          const v = String(j.latestVersion || '0.0.0').split('.').map((n) => parseInt(n, 10) || 0);
          while (v.length < 3) v.push(0);
          v[2] = (v[2] || 0) + 1;
          j.latestVersion = v.join('.');
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          const ver = j.latestVersion;

          // 同步 js/config.js 的 app.version
          const cfgPath = 'js/config.js';
          const cfg = fs.readFileSync(cfgPath, 'utf8');
          fs.writeFileSync(cfgPath, cfg.replace(/(version:\s*')(\d+\.\d+\.\d+)/, '$1' + ver));

          // 同步 sw.js 缓存名
          const swPath = 'sw.js';
          const sw = fs.readFileSync(swPath, 'utf8');
          fs.writeFileSync(swPath, sw.replace(/(sdv-guide-v)(\d+\.\d+\.\d+)/, '$1' + ver));

          // 同步 notice.json 的 version 字段（公告文字 items 保留，下次发布时由开发者人工更新）
          const nPath = 'notice.json';
          const n = JSON.parse(fs.readFileSync(nPath, 'utf8'));
          n.version = ver;
          fs.writeFileSync(nPath, JSON.stringify(n, null, 2) + '\n');

          console.log('bumped to ' + ver + '（version.json / notice.json / config.js / sw.js 已同步）');
          EOF

      # ---------------------------------------------------------------
      # 自动提交修改后的版本文件回仓库（仅版本递增时执行）
      # ---------------------------------------------------------------
      - name: Commit and push
        if: steps.detect.outputs.only_version_files == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json notice.json js/config.js sw.js
          NEW_VER=$(node -p "require('./version.json').latestVersion")
          git commit -m "chore: bump version to v$NEW_VER" || true
          git push origin main
