name: Bump Version

# 触发条件：向 main 分支推送代码时执行
# 版本递增规则（重要，v2.0.x 发布流程）：
#   - 版本号分两轨：
#     ① 代码版本（js/config.js 的 app.version + sw.js 的 CACHE_NAME）：
#        仅当本次提交包含业务代码/功能改动且未手动改动发布版本时，自动递增补丁号（+0.0.1）；
#     ② 发布版本（version.json 的 latestVersion + notice.json 的 version）：
#        「更新弹窗触发器」——由开发者手动修改推送；工作流绝不自动改动。
#   - 两种发布模式：
#     A) 同步发版（两版本号同步）：开发者手动把四文件（config.js / sw.js /
#        version.json / notice.json）统一升到新版本一起推送 → 检测到发布版本文件
#        有改动，跳过自动 bump，远端两轨版本保持一致；
#     B) 双轨发版：只推送业务代码（config.js/sw.js 不手动改）→ 自动 bump 代码版本，
#        version.json 维持旧版 → 用户使用新代码但不弹更新提示；需要宣布更新时
#        再单独修改 version.json（同步 notice.json）推送，触发更新弹窗。
#   - 防死循环：本次提交仅修改版本/公告相关文件
#     （version.json / notice.json / js/config.js / sw.js）→ 不递增、不自动提交；
#     手动单独推送 version.json/notice.json 属于公告发布，不会触发版本递增。
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全量历史：确保 BEFORE(github.event.before) 提交存在于本地，
                           # 否则 git diff BEFORE AFTER 失败会误判为「仅版本改动」而不递增

      # ---------------------------------------------------------------
      # 版本一致性校验（每次构建前强制，两对独立校验）：
      #   · 代码版本：js/config.js 的 app.version 与 sw.js 的 CACHE_NAME 必须一致；
      #   · 发布版本：version.json 的 latestVersion 与 notice.json 的 version 必须一致
      #     （公告必须与发布版本一起打包、同一次 commit 推送）。
      # 两轨允许不同步：代码先发布（代码版本领先），公告后发布（发布版本跟进）。
      # ---------------------------------------------------------------
      - name: Validate version consistency
        run: |
          node - <<'EOF'
          const fs = require('fs');
          function readJsonVersion(p, field) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            return String(j[field] || '').trim();
          }
          const cfg = fs.readFileSync('js/config.js', 'utf8');
          const m = cfg.match(/version:\s*'(\d+\.\d+\.\d+)'/);
          const cfgVer = m ? m[1] : '';
          const sw = fs.readFileSync('sw.js', 'utf8');
          const swM = sw.match(/sdv-guide-v(\d+\.\d+\.\d+)/);
          const swVer = swM ? swM[1] : '';
          if (!cfgVer || !swVer) {
            console.error('代码版本校验失败：js/config.js 或 sw.js 缺少版本号');
            process.exit(1);
          }
          if (cfgVer !== swVer) {
            console.error('代码版本不匹配：config.js=' + cfgVer + '，sw.js=' + swVer);
            process.exit(1);
          }
          const verJson = readJsonVersion('version.json', 'latestVersion');
          const noticeJson = readJsonVersion('notice.json', 'version');
          if (!verJson || !noticeJson) {
            console.error('发布版本校验失败：version.json 或 notice.json 缺少版本号');
            process.exit(1);
          }
          if (verJson !== noticeJson) {
            console.error('发布版本不匹配：version.json=' + verJson + '，notice.json=' + noticeJson);
            console.error('公告 notice.json 必须与发布版本 version.json 一起打包并保持一致；请修正后重新推送。');
            process.exit(1);
          }
          console.log('版本一致性校验通过：代码版本=' + cfgVer + '（config.js/sw.js），发布版本=' + verJson + '（version.json/notice.json）');
          EOF

      # ---------------------------------------------------------------
      # 防死循环 + 递增判定：
      # 对比本次 push 的 before/after 全部提交改动（避免多提交推送时只检查最后
      # 一个 commit 而漏检业务改动）；输出两个标记：
      #   · only_version_files=true：改动仅含版本/公告相关文件
      #     （version.json / notice.json / js/config.js / sw.js）→ 版本提交 / 公告
      #     发布 / 自动 bump 回写，不再次递增、不自动提交（防死循环）；
      #   · release_changed=true：本次改动包含发布版本文件（version.json 或
      #     notice.json）→ 视为开发者手动「同步发版」，版本已由开发者统一管理，
      #     跳过自动 bump（避免 Actions 再把代码版本 +1 导致两轨不同步）。
      # 仅当「包含业务代码改动」且「未手动改动发布版本」时，才触发补丁递增
      # （只改代码版本 config.js + sw.js）。
      # ---------------------------------------------------------------
      - name: Detect version-only changes
        id: detect
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="(initial-push)"
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          fi
          ONLY_VERSION_FILES=true
          RELEASE_CHANGED=false
          for f in $CHANGED; do
            case "$f" in
              version.json|notice.json)
                RELEASE_CHANGED=true
                ONLY_VERSION_FILES=false ;;
              js/config.js|sw.js) ;;
              *) ONLY_VERSION_FILES=false ;;
            esac
          done
          echo "only_version_files=$ONLY_VERSION_FILES" >> "$GITHUB_OUTPUT"
          echo "release_changed=$RELEASE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "changed_files=$CHANGED"

      # ---------------------------------------------------------------
      # 代码版本递增（仅「业务代码改动」且「未手动同步发版」触发）：
      # 只同步代码版本两处——js/config.js 的 app.version、sw.js 的 CACHE_NAME；
      # version.json / notice.json 保持不动（发布版本由开发者管理，触发弹窗）。
      # ---------------------------------------------------------------
      - name: Bump patch version
        if: steps.detect.outputs.only_version_files == 'false' && steps.detect.outputs.release_changed == 'false'
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const cfgPath = 'js/config.js';
          const cfg = fs.readFileSync(cfgPath, 'utf8');
          const m = cfg.match(/version:\s*'(\d+\.\d+\.\d+)'/);
          const cur = m ? m[1] : '0.0.0';
          const v = cur.split('.').map((n) => parseInt(n, 10) || 0);
          while (v.length < 3) v.push(0);
          v[2] = (v[2] || 0) + 1;
          const ver = v.join('.');
          fs.writeFileSync(cfgPath, cfg.replace(/(version:\s*')(\d+\.\d+\.\d+)/, '$1' + ver));
          const swPath = 'sw.js';
          const sw = fs.readFileSync(swPath, 'utf8');
          fs.writeFileSync(swPath, sw.replace(/(sdv-guide-v)(\d+\.\d+\.\d+)/, '$1' + ver));
          console.log('代码版本 bumped to ' + ver + '（config.js + sw.js 已同步；version.json/notice.json 保持不动，等待单独发布）');
          EOF

      # ---------------------------------------------------------------
      # 自动提交修改后的版本文件回仓库（仅代码版本递增时执行；
      # version.json / notice.json 不参与自动提交，由开发者管理）
      # ---------------------------------------------------------------
      - name: Commit and push
        if: steps.detect.outputs.only_version_files == 'false' && steps.detect.outputs.release_changed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/config.js sw.js
          NEW_VER=$(node -e "const s=require('fs').readFileSync('js/config.js','utf8');const m=s.match(/version:\\s*'(\\d+\\.\\d+\\.\\d+)'/);process.stdout.write(m?m[1]:'0.0.0')")
          git commit -m "chore: bump code version to v$NEW_VER" || true
          git push origin main
